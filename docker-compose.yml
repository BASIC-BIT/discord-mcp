services:
  discord-mcp:
    container_name: discord-mcp
    build:
      context: .
    image: saseq/discord-mcp:latest
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-http}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Unset by default, which leaves download_attachment refusing. Set it to the
      # container path below to enable downloads; the named volume is what keeps them
      # when the container is recreated.
      DISCORD_MCP_DOWNLOAD_ROOT: ${DISCORD_MCP_DOWNLOAD_ROOT:-}
      # Unset by default, which leaves send_file and set_guild_scheduled_event_image
      # refusing local paths — the latter still works via its imageUrl. Its own volume below, so
      # reading uploads and writing downloads stay separate grants. Pointing it at the
      # downloads path instead is what chains download_attachment into
      # set_guild_scheduled_event_image, and is a decision rather than a default.
      DISCORD_MCP_FILE_ROOT: ${DISCORD_MCP_FILE_ROOT:-}
    volumes:
      # A named volume, because the app writes downloads and they should survive `docker rm`.
      - discord-mcp-downloads:/var/lib/discord-mcp/downloads
      # A read-only bind mount, because the opposite is true of uploads: the operator puts files
      # here and the app only ever reads them. A named volume would be the wrong shape — nothing
      # on the host can write into one without `docker cp` or a helper container, which makes
      # "put the file there" advice impossible to follow. `:ro` also enforces at the mount what
      # the docs describe, so this path cannot become a second place the app writes.
      - ./uploads:/var/lib/discord-mcp/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  discord-mcp-downloads:
